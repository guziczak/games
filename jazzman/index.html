<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0e0e0c">
    <meta name="description" content="Jazzman - generatywny zespół jazzowy w przeglądarce. Kompletne, strukturalne utwory syntezowane w czasie rzeczywistym.">
    <title>Jazzman — generatywny zespół jazzowy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script>
        window.AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!window.AudioContext) {
            document.addEventListener('DOMContentLoaded', function () {
                document.body.innerHTML = '<main class="app"><p class="status">' +
                    'Ta przeglądarka nie obsługuje Web Audio API. Wypróbuj aktualny Chrome, Firefox lub Safari.' +
                    '</p></main>';
            });
        }
    </script>
</head>
<body>
    <main class="app">
        <header class="masthead">
            <div class="wordmark">Jazzman<span class="wordmark__no">vol.&nbsp;III</span></div>
            <div class="masthead__right">
                <span class="led" id="playLed" aria-hidden="true"></span>
                <span class="masthead__tag">zespół generatywny</span>
            </div>
        </header>

        <section class="stage" aria-label="Odtwarzany utwór">
            <canvas class="stage__viz" id="vizCanvas" aria-hidden="true"></canvas>

            <div class="stage__now">
                <div class="chord" id="chordDisplay">—</div>
                <div class="stage__meta">
                    <span class="section-label" id="sectionLabel">gotowy do gry</span>
                    <span class="meta-line" id="metaLine"></span>
                </div>
            </div>

            <div class="timeline" id="timeline" aria-hidden="true"></div>
        </section>

        <section class="deck" aria-label="Sterowanie">
            <div class="transport">
                <button id="startButton" class="play-button" type="button">Aktywuj audio</button>
                <div class="tempo">
                    <label class="micro-label" for="tempo">Tempo</label>
                    <input type="range" id="tempo" min="60" max="240" value="120">
                    <span class="tempo__value" id="tempoValue">120 BPM</span>
                </div>
            </div>

            <div class="row">
                <div class="seg" role="group" aria-label="Styl">
                    <button id="styleSwing" class="seg__btn active" type="button">Swing</button>
                    <button id="styleBebop" class="seg__btn" type="button">Bebop</button>
                    <button id="styleFusion" class="seg__btn" type="button">Fusion</button>
                    <button id="styleModal" class="seg__btn" type="button">Modal</button>
                </div>
            </div>

            <div class="row row--split">
                <div class="chips" role="group" aria-label="Instrumenty">
                    <button id="pianoToggle" class="chip active" type="button">Fortepian</button>
                    <button id="bassToggle" class="chip active" type="button">Kontrabas</button>
                    <button id="drumsToggle" class="chip active" type="button">Perkusja</button>
                    <button id="trumpetToggle" class="chip active" type="button">Trąbka</button>
                </div>
                <div class="auto-jazz" id="autoJazzContainer">
                    <button id="autoJazzButton" class="chip chip--auto" type="button">Auto-Jazz</button>
                    <div class="auto-jazz__meter" aria-hidden="true">
                        <div class="auto-jazz__progress" id="autoJazzProgress"></div>
                    </div>
                </div>
            </div>
        </section>

        <footer class="foot">
            <span class="status" id="status">Kliknij „Aktywuj audio", aby rozpocząć.</span>
            <span class="mood">nastrój: <em id="moodDisplay">—</em></span>
        </footer>

        <div class="error" id="errorMessage" role="alert"></div>
        <div id="visualizer" hidden></div>
        <div id="notesAnimation" hidden></div>
    </main>

    <script type="module" src="js/main.js"></script>
</body>
</html>
